name: RaceDay CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  validate-structure:
    name: Validate repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the docs folder holds the Part 1 documents
        run: |
          set -e
          test -d docs || { echo "::error::docs folder is missing"; exit 1; }
          shopt -s nullglob
          erd=(docs/*ERD*.png docs/*ERD*.pdf)
          plan=(docs/*Endpoint*.pdf docs/*Endpoint*.md)
          sql=(docs/*.sql)
          [ ${#erd[@]} -gt 0 ]  || { echo "::error::No ERD in docs"; exit 1; }
          [ ${#plan[@]} -gt 0 ] || { echo "::error::No endpoint plan in docs"; exit 1; }
          [ ${#sql[@]} -gt 0 ]  || { echo "::error::No .sql script in docs"; exit 1; }
          echo "docs folder is complete."
      - name: Check the projects, Dockerfile and README are present
        run: |
          set -e
          test -f RaceDay.Api/RaceDay.Api.csproj
          test -f RaceDay.Api.Tests/RaceDay.Api.Tests.csproj
          test -f RaceDay.Mvc/RaceDay.Mvc.csproj
          test -f RaceDay.Mvc.Tests/RaceDay.Mvc.Tests.csproj
          test -f RaceDay.Mvc/Dockerfile
          test -f README.md
          echo "Project structure is correct."
      - name: Check the MVC project has no database access
        run: |
          if grep -E "EntityFrameworkCore|SqlClient|Azure\.Storage" RaceDay.Mvc/RaceDay.Mvc.csproj; then
            echo "::error::RaceDay.Mvc must only talk to the API"; exit 1
          fi
          echo "MVC project calls the API only."

  build-and-test:
    name: Build API and MVC, run unit tests
    runs-on: ubuntu-latest
    needs: validate-structure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore RaceDay.Api/RaceDay.Api.csproj
      - run: dotnet restore RaceDay.Mvc/RaceDay.Mvc.csproj
      - run: dotnet restore RaceDay.sln
      - run: dotnet build RaceDay.Api/RaceDay.Api.csproj --configuration Release --no-restore
      - run: dotnet build RaceDay.Mvc/RaceDay.Mvc.csproj --configuration Release --no-restore
      - run: dotnet build RaceDay.sln --configuration Release --no-restore
      - run: dotnet test RaceDay.sln --configuration Release --no-build --verbosity normal

  docker-build:
    name: Build the MVC Docker image
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t raceday-mvc ./RaceDay.Mvc
      - name: Start the container and check the site responds
        run: |
          docker run -d -p 8080:8080 -e ApiBaseUrl=http://host.docker.internal:5101 --name raceday-mvc raceday-mvc
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/Account/Login || true)
            [ "$code" = "200" ] && { echo "Container is serving pages (HTTP 200)."; exit 0; }
            sleep 2
          done
          docker logs raceday-mvc
          echo "::error::Container did not respond"; exit 1
